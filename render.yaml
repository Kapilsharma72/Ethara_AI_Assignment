services:
  - type: web
    name: team-task-manager-server
    runtime: node
    buildCommand: npm install && npm run build
    startCommand: node server/start.js
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: CLIENT_ORIGIN
        sync: false
