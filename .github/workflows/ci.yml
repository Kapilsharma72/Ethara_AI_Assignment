name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  # ─── Server Tests ────────────────────────────────────────────────────────────
  test-server:
    name: Server Tests
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: test
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install root dependencies
        run: npm ci

      - name: Install server dependencies
        run: npm ci
        working-directory: server

      - name: Run database migrations
        working-directory: server
        run: npx ts-node src/db/migrate.ts
        env:
          DATABASE_URL: postgresql://test:test@localhost:5432/test

      - name: Run server tests
        working-directory: server
        run: npm test
        env:
          DATABASE_URL: postgresql://test:test@localhost:5432/test
          JWT_SECRET: ci-test-secret-key-that-is-at-least-32-chars
          PORT: '3000'
          CLIENT_ORIGIN: http://localhost:5173

      - name: Build server
        working-directory: server
        run: npm run build

  # ─── Client Tests ────────────────────────────────────────────────────────────
  test-client:
    name: Client Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install root dependencies
        run: npm ci

      - name: Install client dependencies
        run: npm ci
        working-directory: client

      - name: Run client tests
        working-directory: client
        run: npm test
        env:
          VITE_API_URL: https://placeholder.onrender.com

      - name: Build client
        working-directory: client
        run: npm run build
        env:
          VITE_API_URL: https://placeholder.onrender.com
